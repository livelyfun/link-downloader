<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Light Neumorphic outer base -->
    <linearGradient id="neuBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f9fe"/>
      <stop offset="52%" stop-color="#eaf0f8"/>
      <stop offset="100%" stop-color="#d7e1ee"/>
    </linearGradient>
    <!-- Recessed inner neumorphic dish -->
    <linearGradient id="neuWell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2dce9"/>
      <stop offset="55%" stop-color="#e7eef7"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <!-- Vibrant azure-cyan link & arrow jewel gradient -->
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="48%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="arrowShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="softDrop" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1d4ed8" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Outer soft neumorphic squircle -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#neuBase)"/>
  <!-- Top-left light highlight bevel -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.92"/>
  <!-- Bottom-right subtle depth bevel -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="none" stroke="#b9c7da" stroke-width="4" stroke-opacity="0.65"/>

  <!-- Inner soft neumorphic well -->
  <rect x="74" y="74" width="364" height="364" rx="88" fill="url(#neuWell)"/>
  <rect x="76" y="76" width="360" height="360" rx="86" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Central elevated azure-cyan jewel -->
  <g filter="url(#softDrop)">
    <rect x="116" y="116" width="280" height="280" rx="70" fill="url(#azureGrad)"/>
    <rect x="120" y="120" width="272" height="272" rx="66" fill="none" stroke="#93c5fd" stroke-width="4" stroke-opacity="0.6"/>
  </g>

  <!-- Interlocking Chain Link arch at top + Download Arrow plunging into tray -->
  <!-- Top link arc -->
  <path d="M196 190c0-25 20-44 45-44h30c25 0 45 19 45 44" fill="none" stroke="url(#arrowShine)" stroke-width="22" stroke-linecap="round"/>
  <!-- Vertical arrow stem -->
  <path d="M256 176v128" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
  <!-- Arrow chevron -->
  <path d="M196 254l60 60 60-60" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sleek receiver base bar -->
  <path d="M174 344h164" fill="none" stroke="#e0f2fe" stroke-width="22" stroke-linecap="round"/>
</svg>
