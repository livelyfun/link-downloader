name: Cross-Platform Packaging Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    name: Package Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt and packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            nodejs \
            dpkg-dev \
            rpm \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Run verification suite and build artifacts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/verify.py

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: link-downloader-linux-x86_64
          path: |
            dist/link-downloader-*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/rpm/*.spec

  build-windows:
    name: Package Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Verify and build Windows bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check src tests scripts
          pytest -v
          python scripts/build.py

      - name: Smoke-test packaged Windows executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\dist\link-downloader\link-downloader.exe --version
          .\dist\link-downloader\link-downloader.exe --self-test

      - name: Optional Windows Authenticode signing
        if: ${{ vars.ENABLE_WINDOWS_SIGNING == 'true' }}
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) {
            Write-Host "Signing secret not configured; skipping Authenticode signing."
            exit 0
          }
          $certPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1
          if ($signtool) {
            & $signtool.FullName sign /f $certPath /p $env:WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 .\dist\link-downloader\link-downloader.exe
          }
          Remove-Item $certPath -Force -ErrorAction SilentlyContinue

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: link-downloader-windows-x86_64
          path: dist/link-downloader-*.zip

  build-macos:
    name: Package macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Verify and build macOS bundle (.app / .dmg)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check src tests scripts
          pytest -v
          python scripts/build.py

      - name: Smoke-test packaged macOS binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "./dist/Link Downloader.app/Contents/MacOS/link-downloader" --version
          "./dist/Link Downloader.app/Contents/MacOS/link-downloader" --self-test

      - name: Optional Apple Developer code-signing & notarization
        if: ${{ vars.ENABLE_APPLE_SIGNING == 'true' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Apple signing secrets not configured; leaving build unsigned."
            exit 0
          fi
          codesign --deep --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" "./dist/Link Downloader.app"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: link-downloader-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            "dist/Link Downloader.app"
