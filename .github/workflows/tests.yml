name: Automated Tests & Lint

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux Qt and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            nodejs \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libdbus-1-3

      - name: Install macOS FFmpeg and Node.js
        if: runner.os == 'macOS'
        run: brew install ffmpeg node

      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Run Ruff static checks
        run: ruff check src tests scripts

      - name: Run pytest suite (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

      - name: Run headless application self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m link_downloader.main --self-test
