[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "link-downloader"
version = "2.0.0"
description = "Cross-platform native Python desktop downloader for supported media platforms and direct file URLs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.16"
authors = [
    { name = "Mithlesh Kumar Das", email = "196286275+livelyfun@users.noreply.github.com" },
]
keywords = ["downloader", "pyside6", "qt6", "yt-dlp", "httpx", "desktop", "media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.6.0",
    "yt-dlp[default]>=2025.1.1",
    "httpx>=0.27.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.8.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.8.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
link-downloader = "link_downloader.main:main"

[project.gui-scripts]
link-downloader-gui = "link_downloader.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "gui: GUI tests requiring Qt application",
    "integration: integration tests using local servers or mocked engines",
    "security: security validation tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["link_downloader", "tests"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
]
